<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline NMT Translation Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-md border border-slate-200">
        <h1 class="text-2xl font-bold mb-2 text-slate-800">Local Translation Service</h1>
        <p class="text-sm text-slate-500 mb-6">Runs completely offline on local NMT model engines.</p>
        
        <form hx-post="/translate" hx-target="#output" hx-swap="outerHTML" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Source Text (Spanish):</label>
                <textarea name="text" rows="4" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Escribe algo en español..."></textarea>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
                Translate to English
            </button>
        </form>

        <div class="mt-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">Translation Result:</label>
            <div id="output" class="p-4 bg-slate-100 rounded-lg border border-dashed border-slate-300 text-slate-400 italic">
                Translation will appear here...
            </div>
        </div>
    </div>
</body>
</html>
